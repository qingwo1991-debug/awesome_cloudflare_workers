# 工作流名称
name: Build, Patch, Obfuscate, and Deploy Worker

# 触发工作流的事件
on:
  # 1. 当代码推送到 main 分支时触发
  push:
    branches:
      - main
  # 2. 定时触发：每天凌晨 3 点自动运行一次 (UTC时间，对应北京时间上午11点)
  schedule:
    - cron: "0 3 * * *"
  # 3. 手动触发：允许在 GitHub Actions 页面点击按钮手动运行
  workflow_dispatch:

# 为工作流设置默认权限
permissions:
  contents: write # 允许 actions 修改仓库内容（如果需要）

# 工作流中的任务
jobs:
  # === 任务 1: 构建、打补丁和混淆代码 ===
  build_patch_and_obfuscate:
    name: "🏗️ Build, Patch, and Obfuscate"
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 检出您的代码仓库
      - name: Check out the code
        uses: actions/checkout@v4

      # 步骤 2: 设置 Node.js 环境
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest" # 使用最新的 Node.js 版本

      # 步骤 3: 安装 javascript-obfuscator
      - name: Install dependencies
        run: |
          npm install -g javascript-obfuscator

      # 步骤 4: 下载原始 Worker 脚本和 Patch 文件
      - name: Download worker.js and patch file
        run: |
          wget -O worker-vless.js https://raw.githubusercontent.com/zizifn/edgetunnel/main/src/worker-vless.js
          wget -O vless-nat64.patch https://raw.githubusercontent.com/cylind/awesome_cloudflare_workers/main/vless-nat64.patch

      # 步骤 5: 应用 Patch
      - name: Apply vless-nat64 patch
        run: |
          patch worker-vless.js < vless-nat64.patch
          # 将打好补丁的文件重命名为 origin.js 以便后续步骤使用
          mv worker-vless.js origin.js

      # 步骤 6: 对脚本进行高强度混淆
      - name: Obfuscate the patched worker js
        run: |
          javascript-obfuscator origin.js --output _worker.js \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 1 \
            --dead-code-injection true \
            --dead-code-injection-threshold 1 \
            --identifier-names-generator hexadecimal \
            --rename-globals true \
            --string-array true \
            --string-array-encoding 'rc4' \
            --string-array-threshold 1 \
            --transform-object-keys true \
            --unicode-escape-sequence true

      # 步骤 7: 上传混淆后的脚本作为 Artifact，供部署任务使用
      - name: Upload obfuscated script as artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-script # Artifact 的名称
          path: _worker.js   # 要上传的文件路径

  # === 任务 2: 部署到 Cloudflare ===
  # 这个任务依赖于上一个任务的成功完成
  deploy_to_cloudflare:
    name: "🚀 Deploy to Cloudflare"
    needs: build_patch_and_obfuscate # 确保在构建和混淆成功后再执行部署
    runs-on: ubuntu-latest

    steps:
      # 步骤 1: 下载由 build 任务创建的 Artifact
      - name: Download obfuscated script artifact
        uses: actions/download-artifact@v4
        with:
          name: worker-script # 必须与上传时的名称一致

      # 步骤 2: 创建 Wrangler 配置文件
      - name: "📝 Create wrangler.toml"
        run: |
          echo 'name = "${{ secrets.CF_WORKER_NAME }}"' >> wrangler.toml
          echo 'main = "./_worker.js"' >> wrangler.toml
          echo 'compatibility_date = "2024-04-05"' >> wrangler.toml

      # 步骤 3: 使用 Wrangler Action 部署到 Cloudflare
      - name: "🚀 Deploy to Cloudflare Workers"
        uses: cloudflare/wrangler-action@v3
        env:
          # 将 secrets 传递给下一步的 vars 使用
          NAT64_PREFIX: ${{ secrets.NAT64_PREFIX }}
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '3.57.0' # 建议锁定一个稳定的版本
          # 在部署前运行的命令，确保每次部署都使用最新的 Secret
          preCommands: |
            echo "🔑 Setting secret: UUID..."
            # 先尝试删除旧的 Secret，使用 "|| true" 忽略删除失败的错误
            npx wrangler secret delete UUID || true
            # 创建新的 Secret
            echo "${{ secrets.UUID }}" | npx wrangler secret put UUID
          # 执行部署命令
          command: deploy
          # 将环境变量作为文本变量（bindings）添加到 Worker
          vars: |
            NAT64_PREFIX

